server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: DoQFlowAI
  # 로컬 실행 시 프로젝트 루트의 .env를 읽는다. 파일이 없으면 환경변수만 사용한다.
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet.multipart:
    max-file-size: 20MB
    max-request-size: 220MB

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000        # 15분
  refresh-expiration: 1209600000   # 14일

ai:
  base-url: ${AI_BASE_URL:http://ai-module:8000}
  internal-key: ${AI_INTERNAL_KEY}
  connect-timeout: 3s
  read-timeout: 60s

app:
  upload-dir: ${UPLOAD_DIR:/app/uploads}
  login: { max-failures: 5, lock-minutes: 15 }
  upload:
    max-files: 10
    allowed-mime: "application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
  rate-limit: { chat-per-minute: 20, lookup-per-minute: 30 }
  chat: { max-question-length: 1000, top-k: 5 }
  cors.allowed-origins: ${CORS_ORIGINS}
  signup.lead-key: ${SIGNUP_KEY_LEAD}   # Day 5 SEC-B 조치 시 사용

management.endpoints.web.exposure.include: ${ACTUATOR_EXPOSURE:health,info}
