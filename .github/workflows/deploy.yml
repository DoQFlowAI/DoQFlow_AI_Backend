name: Deploy

# main에 push되면 테스트 → 이미지 빌드·GHCR 업로드 → EC2에서 backend만 새 이미지로 다시 띄운다.
# 프론트 레포 deploy.yml과 같은 구조다. /opt/doqflow의 docker-compose.yml·.env는 프론트 워크플로가 관리하고,
# 이 워크플로는 tags.env의 BACKEND_TAG만 바꾼다 (비밀값을 다루지 않는다).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: deploy

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: doqflow_it
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["3306:3306"]
    env:
      # 통합 테스트용 일회성 DB. 실제 비밀값이 아니다
      DOQ_IT_DB_URL: jdbc:mariadb://127.0.0.1:3306/doqflow_it
      DOQ_IT_DB_USER: root
      DOQ_IT_DB_PASSWORD: ci-root-password
      CORS_ORIGINS: ""
      SIGNUP_KEY_LEAD: ci-signup-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/doqflowai/doqflow-backend:${{ github.sha }}
            ghcr.io/doqflowai/doqflow-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, doqflow-ec2]
    steps:
      - name: Check shared files
        working-directory: /opt/doqflow
        run: |
          # compose 파일과 .env는 프론트 워크플로가 만든다. 없으면 먼저 프론트 배포가 한 번 돌아야 한다
          test -f docker-compose.yml || { echo "docker-compose.yml 없음: 프론트 배포를 먼저 실행하세요"; exit 1; }
          test -f .env || { echo ".env 없음: 프론트 배포를 먼저 실행하세요"; exit 1; }
          test -f tags.env || printf 'FRONTEND_TAG=latest\nBACKEND_TAG=latest\nAI_TAG=latest\n' > tags.env

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        working-directory: /opt/doqflow
        run: |
          flock .deploy.lock sh -c '
            sed -i "s/^BACKEND_TAG=.*/BACKEND_TAG=${GITHUB_SHA}/" tags.env
            DC="docker compose --env-file .env --env-file tags.env"
            $DC pull backend
            $DC up -d --no-deps backend
          '
          docker image prune -f

      - name: Health check
        working-directory: /opt/doqflow
        run: |
          # /api/actuator는 Nginx가 외부에서 막으므로 컨테이너 헬스 상태로 확인한다 (Dockerfile HEALTHCHECK)
          CID=$(docker compose --env-file .env --env-file tags.env ps -q backend)
          for i in $(seq 1 30); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$CID")
            echo "backend health: $STATUS"
            [ "$STATUS" = healthy ] && exit 0
            sleep 5
          done
          docker logs --tail 100 "$CID"
          exit 1
