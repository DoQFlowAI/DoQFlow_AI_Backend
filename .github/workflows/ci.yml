name: CI

# PR마다 단위 테스트와 실제 MariaDB 통합 테스트를 모두 돌린다
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: doqflow_it
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["3306:3306"]
    env:
      # 통합 테스트용 일회성 DB. 실제 비밀값이 아니다
      DOQ_IT_DB_URL: jdbc:mariadb://127.0.0.1:3306/doqflow_it
      DOQ_IT_DB_USER: root
      DOQ_IT_DB_PASSWORD: ci-root-password
      # application.yaml의 필수 값. 테스트에서는 쓰지 않는다
      CORS_ORIGINS: ""
      SIGNUP_KEY_LEAD: ci-signup-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B test
